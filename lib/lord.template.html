<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<style>
  :root { --bg:#faf8f4; --ink:#1a1714; --muted:#7a6e63; --grid:#e6ded2; --amber:#b06a16; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif;
    display:flex; justify-content:center; padding:28px 16px; }
  .card { width:100%; max-width:760px; }
  h1 { font-size:1.3rem; margin:0 0 .25rem; }
  p.lede { color:var(--muted); margin:0 0 1.1rem; max-width:62ch; }
  p.lede strong { color:var(--ink); }
  .controls { display:flex; align-items:center; gap:14px; margin:6px 0 4px; }
  .controls label { font-weight:600; font-size:.92rem; white-space:nowrap; }
  input[type=range] { flex:1; accent-color:var(--amber); }
  .state { color:var(--muted); font-size:.9rem; min-width:12ch; }
  svg { width:100%; height:auto; display:block; }
  .axis { stroke:var(--grid); stroke-width:1; }
  .axislabel { fill:var(--muted); font-size:12px; }
  .callout { font-size:13px; font-weight:600; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:.4rem; }
  footer { color:var(--muted); font-size:.8rem; margin-top:1.2rem; }
</style>
</head>
<body>
<div class="card">
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>
  <div class="controls">
    <label>__LEFT__</label>
    <input id="reveal" type="range" min="0" max="100" value="0" />
    <label>__RIGHT__</label>
  </div>
  <div class="state" id="state"></div>
  <svg id="chart" viewBox="0 0 760 480" role="img"></svg>
  <div class="hint">__HINT__</div>
  <footer>__FOOTER__</footer>
</div>
<script>
const DATA = __DATA__;
const svg = document.getElementById("chart");
const NS = "http://www.w3.org/2000/svg";
const W=760,H=480,M={l:66,r:18,t:18,b:54};
const plotW=W-M.l-M.r, plotH=H-M.t-M.b;
const [x0,x1]=DATA.domain.x,[y0,y1]=DATA.domain.y;
const sx=v=>M.l+(v-x0)/(x1-x0)*plotW, sy=v=>M.t+(1-(v-y0)/(y1-y0))*plotH;
const INK="#1a1714", MUTED="#7a6e63";
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function axes(){
  svg.appendChild(el("line",{class:"axis",x1:M.l,y1:M.t,x2:M.l,y2:M.t+plotH}));
  svg.appendChild(el("line",{class:"axis",x1:M.l,y1:M.t+plotH,x2:M.l+plotW,y2:M.t+plotH}));
  const xl=el("text",{class:"axislabel","text-anchor":"middle",x:M.l+plotW/2,y:H-12});xl.textContent=DATA.xLabel;svg.appendChild(xl);
  const yl=el("text",{class:"axislabel","text-anchor":"middle",transform:`translate(15,${M.t+plotH/2}) rotate(-90)`});yl.textContent=DATA.yLabel;svg.appendChild(yl);
}
const dyn=el("g",{}); axes(); svg.appendChild(dyn);
function gx(i){ let lo=Infinity,hi=-Infinity; for(const p of DATA.points) if(p.g===i){lo=Math.min(lo,p.x);hi=Math.max(hi,p.x);} return [lo,hi]; }
function fy(i,x){ return DATA.fits[i].m*x+DATA.fits[i].b; }

function render(t){
  dyn.replaceChildren();
  for(const p of DATA.points)
    dyn.appendChild(el("circle",{cx:sx(p.x),cy:sy(p.y),r:3.4,fill:DATA.groupColors[p.g],"fill-opacity":0.72}));

  // ── change-score view (t small): the no-change diagonal + group means on it
  if(t < 0.999){
    const lo=Math.max(x0,y0), hi=Math.min(x1,y1);
    dyn.appendChild(el("line",{x1:sx(lo),y1:sy(lo),x2:sx(hi),y2:sy(hi),
      stroke:INK,"stroke-width":1.4,"stroke-dasharray":"6 5","stroke-opacity":0.45*(1-t)}));
    DATA.groupMeans.forEach((g,i)=>{
      dyn.appendChild(el("circle",{cx:sx(g.x),cy:sy(g.y),r:8,fill:DATA.groupColors[i],
        stroke:"#fff","stroke-width":2,"fill-opacity":1-t}));
    });
  }
  // ── ANCOVA view (t large): within-group regression lines + the gap at a fixed baseline
  if(t > 0.001){
    DATA.fits.forEach((f,i)=>{
      const [a,b]=gx(i);
      dyn.appendChild(el("line",{x1:sx(a),y1:sy(f.m*a+f.b),x2:sx(b),y2:sy(f.m*b+f.b),
        stroke:DATA.groupColors[i],"stroke-width":3.4,"stroke-opacity":t,"stroke-linecap":"round"}));
    });
    const ax=DATA.adjustX, yA=fy(0,ax), yB=fy(1,ax);
    dyn.appendChild(el("line",{x1:sx(ax),y1:sy(y0),x2:sx(ax),y2:sy(y1),
      stroke:MUTED,"stroke-width":1,"stroke-dasharray":"3 4","stroke-opacity":0.6*t}));
    dyn.appendChild(el("line",{x1:sx(ax),y1:sy(yA),x2:sx(ax),y2:sy(yB),
      stroke:INK,"stroke-width":4,"stroke-opacity":t}));
    const gap=Math.abs(yB-yA);
    const lab=el("text",{x:sx(ax)+8,y:sy((yA+yB)/2),"font-size":12,"font-weight":700,
      fill:INK,"fill-opacity":t}); lab.textContent=`gap ≈ ${gap.toFixed(1)} ${DATA.unit||""}`.trim();
    dyn.appendChild(lab);
  }
  const txt=el("text",{class:"callout","text-anchor":"end",x:W-M.r,y:M.t+plotH-10});
  txt.textContent = t<0.5 ? DATA.calloutGain : DATA.calloutAdj;
  txt.setAttribute("fill", t<0.5 ? MUTED : DATA.groupColors[1]);
  dyn.appendChild(txt);
}
const slider=document.getElementById("reveal"), st=document.getElementById("state");
slider.addEventListener("input",()=>{const t=slider.value/100;render(t);
  st.textContent=t<0.05?DATA.stateGain:t>0.95?DATA.stateAdj:`${slider.value}%`;});
render(0); st.textContent=DATA.stateGain;
</script>
</body>
</html>
