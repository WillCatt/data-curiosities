<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<style>
  :root {
    --bg: #faf8f4; --ink: #1a1714; --muted: #7a6e63; --grid: #e6ded2;
    --amber: #b06a16; --grey: #cdbfae;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif;
    display: flex; justify-content: center; padding: 28px 16px;
  }
  .card { width: 100%; max-width: 760px; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  p.lede { color: var(--muted); margin: 0 0 1.1rem; max-width: 62ch; }
  p.lede strong { color: var(--ink); }
  .controls { display: flex; align-items: center; gap: 14px; margin: 6px 0 4px; }
  .controls label { font-weight: 600; font-size: .92rem; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: var(--amber); }
  .state { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; min-width: 12ch; }
  svg { width: 100%; height: auto; display: block; }
  .axis { stroke: var(--grid); stroke-width: 1; }
  .axislabel { fill: var(--muted); font-size: 12px; }
  .callout { font-size: 13px; font-weight: 600; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: .4rem; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 1.2rem; }
</style>
</head>
<body>
<div class="card">
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>

  <div class="controls">
    <label>__LEFT__</label>
    <input id="thr" type="range" min="0" max="100" value="0" />
    <label>__RIGHT__</label>
  </div>
  <div class="state" id="state"></div>

  <svg id="chart" viewBox="0 0 760 470" role="img"></svg>
  <div class="hint">__HINT__</div>
  <footer>__FOOTER__</footer>
</div>

<script>
const DATA = __DATA__;

const svg = document.getElementById("chart");
const NS = "http://www.w3.org/2000/svg";
const W = 760, H = 470;
const M = { l: 64, r: 18, t: 18, b: 52 };
const plotW = W - M.l - M.r, plotH = H - M.t - M.b;

const [x0, x1] = DATA.domain.x, [y0, y1] = DATA.domain.y;
const sx = v => M.l + (v - x0) / (x1 - x0) * plotW;
const sy = v => M.t + (1 - (v - y0) / (y1 - y0)) * plotH;

const GREY = "#d8ccba", AMBER = "#b06a16", MUTED = "#7a6e63", INK = "#1a1714";
function el(name, attrs){ const e=document.createElementNS(NS,name);
  for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }

// score threshold ranges from min(x+y) (select everyone) to a high pct (select few)
const scores = DATA.points.map(p => p.x + p.y).sort((a,b)=>a-b);
const sMin = scores[0], sMax = scores[scores.length-1];

function fit(pts){
  const n = pts.length; if(n < 3) return null;
  let sx_=0, sy_=0, sxx=0, sxy=0;
  for(const p of pts){ sx_+=p.x; sy_+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; }
  const mx=sx_/n, my=sy_/n;
  const denom = sxx - n*mx*mx; if(Math.abs(denom)<1e-9) return null;
  const m = (sxy - n*mx*my)/denom; const b = my - m*mx;
  // pearson r
  let syy=0; for(const p of pts){ syy+=p.y*p.y; }
  const cov = sxy - n*mx*my, vx = sxx - n*mx*mx, vy = syy - n*my*my;
  const r = cov/Math.sqrt(vx*vy);
  return { m, b, r };
}

function drawAxes(){
  svg.appendChild(el("line",{class:"axis",x1:M.l,y1:M.t,x2:M.l,y2:M.t+plotH}));
  svg.appendChild(el("line",{class:"axis",x1:M.l,y1:M.t+plotH,x2:M.l+plotW,y2:M.t+plotH}));
  const xl = el("text",{class:"axislabel","text-anchor":"middle",x:M.l+plotW/2,y:H-12});
  xl.textContent = DATA.xLabel; svg.appendChild(xl);
  const yl = el("text",{class:"axislabel","text-anchor":"middle",
    transform:`translate(15,${M.t+plotH/2}) rotate(-90)`});
  yl.textContent = DATA.yLabel; svg.appendChild(yl);
}
const dyn = el("g",{});
drawAxes();
svg.appendChild(dyn);

const slider = document.getElementById("thr");
const stateEl = document.getElementById("state");

function render(frac){
  dyn.replaceChildren();
  const T = sMin + frac * (sMax - sMin) * 0.92;   // selection cutoff on x+y
  const sel = [];
  for(const p of DATA.points){
    const inSel = (p.x + p.y) >= T;
    if(inSel) sel.push(p);
    dyn.appendChild(el("circle",{cx:sx(p.x),cy:sy(p.y),r:3.6,
      fill: inSel ? AMBER : GREY, "fill-opacity": inSel ? 0.9 : 0.28}));
  }
  // selection boundary line x+y = T  ->  y = T - x
  if(frac > 0.01){
    dyn.appendChild(el("line",{x1:sx(x0),y1:sy(T-x0),x2:sx(x1),y2:sy(T-x1),
      stroke:INK,"stroke-width":1.4,"stroke-dasharray":"5 5","stroke-opacity":0.5}));
  }
  const f = fit(sel);
  if(f){
    const xa = Math.max(x0, Math.min(...sel.map(p=>p.x)));
    const xb = Math.min(x1, Math.max(...sel.map(p=>p.x)));
    dyn.appendChild(el("line",{x1:sx(xa),y1:sy(f.m*xa+f.b),x2:sx(xb),y2:sy(f.m*xb+f.b),
      stroke:AMBER,"stroke-width":3.4,"stroke-linecap":"round"}));
    const txt = el("text",{class:"callout","text-anchor":"end",x:W-M.r,y:M.t+plotH-10,fill:AMBER});
    txt.textContent = `${DATA.selectedName}: r = ${f.r.toFixed(2)}`;
    dyn.appendChild(txt);
    stateEl.textContent = `${sel.length} of ${DATA.points.length} selected · r = ${f.r.toFixed(2)}`;
  } else {
    stateEl.textContent = `${sel.length} selected (too few to fit)`;
  }
}
slider.addEventListener("input", ()=>render(slider.value/100));
render(0);
</script>
</body>
</html>
